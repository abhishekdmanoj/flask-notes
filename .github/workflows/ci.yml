name: Flask CI

on:
  push:
    branches:
      - main
      - application-factory

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t flask-notes:v4 \
            -t ghcr.io/abhishekdmanoj/flask-notes:${{ github.sha }} .

      - name: Start Containers
        run: docker compose up -d

      - name: Wait for Flask
        run: |
          until curl -f http://localhost:5000; do
            echo "Waiting for Flask..."
            sleep 1
          done
          echo "Flask is Responding!"

      - name: Run Tests
        run: docker compose exec -T flask python -m pytest -v -s .
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ghcr.io/abhishekdmanoj/flask-notes:${{ github.sha }}

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.FLASK_NOTES_DEPLOY_KEY }}
          script: |
            echo "SSH connection successful"
            hostname

      - name: Stop Containers
        if: always()
        run: docker compose down
