<!DOCTYPE html>
<html>

<head>
	<link rel = "stylesheet" href = "{{ url_for('static', filename = 'style.css') }}">

	<title>
		{% block title %}
		{% endblock %}
	</title>
</head>

<body>
	
	{% with messages = get_flashed_messages() %}
		{% if messages %}
		<div>
			{% for message in messages %}
				<p>{{ message }}</p>
			{% endfor %}
		</div>
		{% endif %}
	{% endwith %}		


	{% block content %}
	{% endblock %}

</body>

</html>
